<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flight Log</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one translucent hero over a full-bleed seasonal scene, then a spreadsheet-style grid (tasks down, days across) with the task column pinned. */
:root {
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
  /* autumn is the default season */
  --sky: linear-gradient(180deg, #2a1209 0%, #7d3412 48%, #e08a2e 100%);
  --hdr: #f2b440; --hdr-ink: #2b1405;
  --task: #b4492a; --task-ink: #fff3df;
  --cell: #f7e6c6; --cell-we: #f0d9ad; --line: #d9b982;
  --box: #9a5a2a; --plane: #8a2f0c; --today: #ffd36b;
  --accent: #ffcf70; --ink: #fff6e8; --glass: rgba(24, 10, 4, .46);
}
body[data-season="winter"] {
  --sky: linear-gradient(180deg, #0c1b30 0%, #1d3b66 100%);
  --hdr: #9fe8ff; --hdr-ink: #06263a;
  --task: #1f5a96; --task-ink: #f1faff;
  --cell: #d8f3fd; --cell-we: #c4e8f6; --line: #8fc5dc;
  --box: #3d7d9b; --plane: #0a5886; --today: #fff2a8;
  --accent: #9fe8ff; --ink: #f2fbff; --glass: rgba(6, 18, 36, .52);
}
body[data-season="spring"] {
  --sky: linear-gradient(180deg, #3a1a35 0%, #b0517f 50%, #ffc6a8 100%);
  --hdr: #ffb7d2; --hdr-ink: #3a0f22;
  --task: #bf4b7b; --task-ink: #fff0f6;
  --cell: #ffeef4; --cell-we: #fddbe8; --line: #eab1c8;
  --box: #b86789; --plane: #a1194f; --today: #fff0a0;
  --accent: #ffb7d2; --ink: #fff3f8; --glass: rgba(48, 12, 32, .46);
}
body[data-season="summer"] {
  --sky: linear-gradient(180deg, #0d3b7a 0%, #2e8fd1 55%, #ffd36b 100%);
  --hdr: #ffe45a; --hdr-ink: #2d2500;
  --task: #d9582b; --task-ink: #fff6e5;
  --cell: #fff4c9; --cell-we: #ffe9a0; --line: #e4cd7a;
  --box: #a98a22; --plane: #c2410c; --today: #ffffff;
  --accent: #ffe45a; --ink: #fffbea; --glass: rgba(6, 30, 66, .46);
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: #1b2a41;
  background: var(--sky);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  transition: background .8s;
  overflow-x: hidden;
}

/* scenery */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.sun { position: absolute; width: 38vmin; height: 38vmin; border-radius: 50%; right: -6vmin; bottom: 12vh; background: radial-gradient(circle, rgba(255,226,150,.95) 0%, rgba(255,170,70,.55) 45%, rgba(255,140,40,0) 70%); opacity: 0; transition: opacity 1s; }
body[data-season="autumn"] .sun, body[data-season="summer"] .sun, body[data-season="spring"] .sun { opacity: .8; }
.hills { position: absolute; left: 0; right: 0; bottom: 0; height: 34vh; opacity: 0; transition: opacity 1s; }
body:not([data-season="winter"]) .hills { opacity: 1; }
.photos { position: absolute; inset: 0; opacity: 0; transition: opacity 1s; }
body[data-season="winter"] .photos { opacity: 1; }
.ph { position: absolute; inset: -2%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.4s ease; filter: none; }
.ph.on { opacity: 1; animation: drift 14s ease-out forwards; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.09); } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; }

/* page */
.wrap {
  position: relative; z-index: 1;
  max-width: 1180px; margin: 0 auto;
  padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
.hero { background: none; padding: 4px 0; display: grid; gap: 18px; text-shadow: 0 1px 6px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.5); }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.title { min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 52px); line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.tag { margin: 6px 0 0; opacity: .85; }
.nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.28); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 40px;
  transition: background .2s, transform .15s;
}
.btn:hover { background: rgba(255,255,255,.22); }
.btn:active { transform: translateY(1px); }
.btn.on { background: var(--accent); color: var(--hdr-ink); border-color: transparent; }
.btn.icon { width: 40px; padding: 0; display: grid; place-items: center; font-size: 18px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.months { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.chip:hover { background: rgba(255,255,255,.2); }
.chip[aria-selected="true"] { background: var(--accent); color: var(--hdr-ink); border-color: transparent; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: none; border: 1px solid rgba(255,255,255,.4); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; opacity: .8; }

.route { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 10px; }
.route .place { font-family: var(--font-display); font-weight: 700; font-size: 15px; padding-bottom: 4px; max-width: 28vw; overflow-wrap: anywhere; }
.route .place[contenteditable] { border-bottom: 1px dashed rgba(255,255,255,.5); outline-offset: 3px; cursor: text; text-align: right; }
.route svg { width: 100%; height: auto; display: block; overflow: visible; min-width: 0; }
.route .hint { grid-column: 1 / -1; font-size: 12.5px; opacity: .75; margin: -4px 0 0; }
.trk { fill: none; stroke: rgba(255,255,255,.35); stroke-width: 2.5; stroke-dasharray: 2 9; stroke-linecap: round; }
.prog { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
.dot { fill: var(--accent); }
.rplane { fill: #fff; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }

/* grid */
.card { background: none; border: 0; padding: 0; }
.gridwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
th, td { padding: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
thead th { background: var(--hdr); color: var(--hdr-ink); font-family: var(--font-display); font-weight: 800; height: 52px; min-width: 46px; text-align: center; font-size: 13px; line-height: 1.1; }
thead th small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 10.5px; opacity: .75; text-transform: uppercase; }
thead th.today { background: var(--today); box-shadow: inset 0 -4px 0 var(--task); }
thead th.we { filter: saturate(.8) brightness(.96); }
.task { position: sticky; left: 0; z-index: 3; background: var(--task); color: var(--task-ink); text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.2; padding: 6px 10px; width: 210px; min-width: 210px; max-width: 210px; border-right: 2px solid rgba(0,0,0,.25); }
thead th.task { background: var(--hdr); color: var(--hdr-ink); font-size: 18px; z-index: 4; }
td.d { background: var(--cell); }
td.d.we { background: var(--cell-we); }
td.d.today { box-shadow: inset 2px 0 0 var(--today), inset -2px 0 0 var(--today); }
td.cnt, th.cnt { background: var(--task); color: var(--task-ink); font-family: var(--font-mono); font-size: 13px; text-align: center; min-width: 64px; font-variant-numeric: tabular-nums; }
th.cnt { background: var(--hdr); color: var(--hdr-ink); font-family: var(--font-display); font-weight: 800; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
tfoot td, tfoot th { background: transparent; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.7); font-family: var(--font-mono); font-size: 12px; text-align: center; height: 36px; border-color: rgba(255,255,255,.28); font-variant-numeric: tabular-nums; }
tfoot th.task { background: transparent; font-family: var(--font-display); font-size: 14px; }
tfoot td.full { color: var(--accent); font-weight: 500; }

.cell { width: 100%; height: 46px; display: grid; place-items: center; background: transparent; border: 0; padding: 0; cursor: pointer; position: relative; }
.cell:disabled { cursor: not-allowed; opacity: .38; }
.box { width: 22px; height: 22px; border: 2px solid var(--box); border-radius: 6px; background: rgba(255,255,255,.35); transition: transform .25s, opacity .2s; }
.cell:not(:disabled):hover .box { transform: scale(1.12); border-color: var(--plane); }
.pl { position: absolute; width: 30px; height: 30px; fill: var(--plane); opacity: 0; transform: scale(.2) rotate(-30deg); transition: transform .5s cubic-bezier(.3, 1.7, .5, 1), opacity .2s; pointer-events: none; }
.cell[aria-pressed="true"] .box { opacity: 0; transform: scale(.3); }
.cell[aria-pressed="true"] .pl { opacity: 1; transform: scale(1) rotate(45deg); }
.cell[aria-pressed="true"]:hover .pl { transform: scale(1.18) rotate(45deg) translate(2px, -2px); }

.rename { font: inherit; font-weight: 700; color: var(--task-ink); background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 6px 8px; width: 100%; text-align: center; }
.del { margin-top: 4px; font: inherit; font-size: 12px; font-weight: 700; color: #fff; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
.del.sure { background: #c0262d; border-color: #ff9a9a; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 6px 4px; }
.addrow[hidden] { display: none; }
.addrow input { flex: 1 1 220px; min-width: 0; font: inherit; color: var(--ink); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 10px 12px; }
.addrow input::placeholder { color: rgba(255,255,255,.6); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; opacity: .8; padding: 0 4px; }

/* flying planes + toast */
.flyer { position: fixed; z-index: 50; width: 30px; height: 30px; pointer-events: none; }
.flyer svg, .fleet svg { width: 100%; height: 100%; fill: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.fleet { position: fixed; z-index: 50; width: 34px; height: 34px; pointer-events: none; left: 0; }
.spark { position: fixed; z-index: 49; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); pointer-events: none; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); background: var(--accent); color: var(--hdr-ink); font-weight: 700; padding: 12px 18px; border-radius: 999px; opacity: 0; transition: .35s; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
  .task { width: 150px; min-width: 150px; max-width: 150px; font-size: 14px; padding: 6px; }
  .route .place { max-width: 24vw; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .ph.on { animation: none; }
  .pl, .box, body { transition: none; }
}

/* clear grid: no fills anywhere, the photos show through; legibility comes from size, weight and shadow */
:root { --ts: 0 1px 4px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.7), 0 0 2px #000; }
.wrap { max-width: 1440px; }
table { width: 100%; }
th, td { border-right: 1px solid rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.4); }
thead th, thead th.task, thead th.today, thead th.we, .task, td.d, td.d.we, td.cnt, th.cnt {
  background: transparent; filter: none; color: #fff; text-shadow: var(--ts);
}
thead th { font-size: 17px; min-width: 34px; height: 60px; }
thead th small { font-size: 12px; opacity: 1; }
thead th.task { font-size: 24px; }
thead th.today { box-shadow: inset 0 4px 0 #fff, inset 0 -4px 0 #fff; }
td.d.today { box-shadow: inset 2px 0 0 #fff, inset -2px 0 0 #fff; }
.task { font-size: 21px; line-height: 1.2; width: 230px; min-width: 230px; max-width: 230px; padding: 6px 12px; border-right: 2px solid rgba(255,255,255,.7); }
td.cnt, th.cnt { font-size: 17px; font-weight: 700; }
tfoot td, tfoot th { font-size: 15px; height: 42px; font-weight: 500; }
tfoot th.task { font-size: 18px; }
.cell { height: 54px; }
.cell:disabled { opacity: .5; }
.box { width: 25px; height: 25px; background: transparent; border: 2.5px solid #fff; box-shadow: 0 0 6px rgba(0,0,0,.8), inset 0 0 6px rgba(0,0,0,.5); }
.cell:not(:disabled):hover .box { border-color: var(--accent); }
.pl { width: 36px; height: 36px; fill: #fff; filter: drop-shadow(0 0 3px rgba(0,0,0,.95)) drop-shadow(0 0 9px rgba(0,0,0,.55)); }
/* autumn now shows photos too, so drop the painted sun and hills there */
body[data-season="autumn"] .photos { opacity: 1; }
body[data-season="autumn"] .sun { opacity: 0; }
body[data-season="autumn"] .hills { opacity: 0; }

/* animated letters */
.ch { display: inline-block; animation: wave 3.4s ease-in-out infinite; }
@keyframes wave {
  0%, 55%, 100% { transform: translateY(0); color: #fff; }
  25% { transform: translateY(-.14em); color: var(--accent); text-shadow: 0 0 18px var(--accent), 0 2px 6px rgba(0,0,0,.7); }
}
.task .tn { display: inline-block; animation: slidein .7s cubic-bezier(.2,.8,.2,1) calc(var(--i) * 70ms) both, glow 5s ease-in-out calc(var(--i) * .4s + 1s) infinite; }
@keyframes slidein { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes glow {
  0%, 100% { text-shadow: var(--ts); transform: scale(1); }
  50% { text-shadow: var(--ts), 0 0 16px var(--accent); transform: scale(1.04); }
}
thead th.today { animation: todayPulse 2.2s ease-in-out infinite; }
@keyframes todayPulse { 0%, 100% { text-shadow: var(--ts); } 50% { text-shadow: var(--ts), 0 0 14px #fff; } }
thead th:not(.task):not(.cnt) { transition: transform .2s; }
thead th:not(.task):not(.cnt):hover { transform: translateY(-3px) scale(1.15); }
@media (prefers-reduced-motion: reduce) { .ch, .task .tn, thead th.today { animation: none; } }
@media (max-width: 1500px) { .task { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); } }
@media (max-width: 640px) {
  .task { width: 150px; min-width: 150px; max-width: 150px; font-size: 16px; padding: 6px; }
  thead th { font-size: 15px; min-width: 44px; }
  thead th.task { font-size: 18px; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="plane" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></symbol>
  </defs>
</svg>

<div class="scene" aria-hidden="true">
  <div class="photos" id="photos"></div>
  <div class="sun"></div>
  <svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="none">
    <path d="M0 300V170C140 110 260 120 400 160s300 40 440-20 260-30 360 10V300Z" fill="rgba(0,0,0,.22)"/>
    <path d="M0 300V220C180 170 320 190 480 220s320 20 460-20 190-10 260 10V300Z" fill="rgba(0,0,0,.30)"/>
  </svg>
  <canvas id="fx"></canvas>
</div>

<main class="wrap">
  <section class="hero" aria-label="Month overview">
    <div class="top">
      <div class="title">
        <p class="eyebrow" id="eyebrow">Autumn</p>
        <h1 id="monthTitle">November 2026</h1>
        <p class="tag" id="tagline">Leaves fall, planes rise.</p>
      </div>
      <div class="nav">
        <button class="btn icon" id="prev" aria-label="Previous month">&#8249;</button>
        <button class="btn" id="todayBtn">Today</button>
        <button class="btn icon" id="next" aria-label="Next month">&#8250;</button>
        <button class="btn" id="editBtn" aria-pressed="false">Edit tasks</button>
      </div>
    </div>

    <div class="months" id="months" role="tablist" aria-label="Choose a month"></div>

    <div class="stats">
      <div class="stat"><b id="sMonth">0</b><span>planes this month</span></div>
      <div class="stat"><b id="sToday">0/0</b><span>done today</span></div>
      <div class="stat"><b id="sStreak">0</b><span>perfect days in a row</span></div>
      <div class="stat"><b id="sTotal">0</b><span>planes all time</span></div>
    </div>

    <div class="route">
      <div class="place">Tashkent</div>
      <svg viewBox="0 0 600 130" role="img" aria-label="Flight progress for this month">
        <path id="trk" class="trk" d="M24 112 Q300 -46 576 112"/>
        <path id="prog" class="prog" d="M24 112 Q300 -46 576 112"/>
        <circle class="dot" cx="24" cy="112" r="6"/>
        <circle class="dot" cx="576" cy="112" r="6" opacity=".55"/>
        <g id="rp"><use class="rplane" href="#plane" x="-16" y="-16" width="32" height="32"/></g>
      </svg>
      <div class="place" id="dest" contenteditable="true" spellcheck="false" role="textbox" aria-label="Destination, click to rename">New York</div>
      <p class="hint" id="routeHint">0% of the way there this month.</p>
    </div>
  </section>

  <section class="card" aria-label="Daily tasks">
    <div class="gridwrap" id="gridwrap">
      <table id="grid"></table>
    </div>
    <form class="addrow" id="addrow" hidden>
      <input id="newTask" type="text" placeholder="New daily task, e.g. Read 20 pages" maxlength="80" autocomplete="off">
      <button class="btn on" type="submit">Add task</button>
    </form>
  </section>

  <div class="foot">
    <span id="saveState">Saved in this browser</span>
    <span>Tap a box to board a plane. Future days unlock at midnight.</span>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var SEASONS = {
    autumn: { name: 'Autumn', tag: 'Leaves fall, planes rise.' },

    summer: { name: 'Summer', tag: 'Clear skies, long runway.' }
  };
  function seasonOf(m) { return [11,0,1].indexOf(m) > -1 ? 'winter' : m < 5 ? 'spring' : m < 8 ? 'summer' : 'autumn'; }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var KEY = 'flightlog-v1';
  var DEFAULT_TASKS = ['Praying Fajr','Praying Dhuhr','Praying Asr','Praying Maghrib','Praying Isha','Watching 40-minute Russian movie (1-hour)','Memorizing text in Russian','10-minute shadowing','Skincare routine','AI and ML learning','Statistical techniques','Intro to Management','ICT lessons'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  /* ---------- state ---------- */
  function fresh() {
    return { tasks: DEFAULT_TASKS.map(function (n, i) { return { id: 't' + (i + 1), name: n }; }), done: {}, dest: 'New York', updated: 0 };
  }
  function normalize(s) {
    var f = fresh();

  }, sets = {}, phIdx = 0, phTimer = null;

  }

    return { x: Math.random() * W, y: initial ? Math.random() * H : -20, z: z, r: pType === 'winter' ? 1.2 + z * 3 : 7 + z * 9,
      vy: pType === 'winter' ? .5 + z * 1.4 : pType === 'summer' ? -(.15 + z * .5) : .7 + z * 1.2,
